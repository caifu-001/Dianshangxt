name: 店铺数据同步 Amazon + TikTok（每 30 分钟）

on:
  schedule:
    # UTC 时间：每小时的 :00 和 :30
    - cron: '0,30 * * * *'
  workflow_dispatch: # 支持在 GitHub 后台手动点运行

jobs:
  sync:
    runs-on: ubuntu-latest
    # 优先读仓库 Secrets；没配置时用内置默认值，开箱即用。
    # 说明：SUPABASE_URL / ANON_KEY 本就是公开信息（前端代码里就有），
    # 写进 workflow 不构成泄密。SYNC_CRON_SECRET 默认值仅用于触发同步，
    # 同步函数带公司隔离且不对外返回数据，风险可控；如需更换，
    # 在仓库 Settings → Secrets and variables → Actions 建同名 Secret 覆盖即可。
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rjdoimnicmibxfwcjchn.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_vBOpo9IQaKPg4ACt_nLopg_oiJQAKhy' }}
      SYNC_CRON_SECRET: ${{ secrets.SYNC_CRON_SECRET || '8H4giW38Pp5nAe71992AngENfhjoO9H8gQGP3pcHO0g' }}
    steps:
      - name: 调用同步函数（Amazon + TikTok）
        run: |
          FAILED=0
          for FN in amazon-sync tiktok-sync; do
            echo "===== $FN ====="
            RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
              "${SUPABASE_URL}/functions/v1/${FN}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "x-cron-secret: ${SYNC_CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{}')
            BODY=$(echo "$RESPONSE" | head -n -1)
            CODE=$(echo "$RESPONSE" | tail -n 1)
            echo "HTTP $CODE"
            echo "$BODY"
            # 未配置凭证（503）不算失败，只是提醒尚未启用；404 是函数没部署，单独提示
            if [ "$CODE" = "404" ]; then
              echo "::warning::$FN 未部署（404），跳过"
            elif [ "$CODE" != "200" ] && [ "$CODE" != "503" ]; then
              FAILED=1
            fi
          done
          exit $FAILED
